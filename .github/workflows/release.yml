name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STOCKWELL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stockwell-upload.keystore"
          echo "STOCKWELL_KEYSTORE_PATH=$RUNNER_TEMP/stockwell-upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB (Fastlane)
        env:
          STOCKWELL_KEYSTORE_PASSWORD: ${{ secrets.STOCKWELL_KEYSTORE_PASSWORD }}
          STOCKWELL_KEY_ALIAS: ${{ secrets.STOCKWELL_KEY_ALIAS }}
          STOCKWELL_KEY_PASSWORD: ${{ secrets.STOCKWELL_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: bundle exec fastlane android release_aab

      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          npx @sentry/cli sourcemaps upload \
            --release "jo.alloussi.stockwell@${VERSION_NAME}" \
            android/app/build/generated/sourcemaps/react/release \
            || echo "Source map upload skipped or failed — verify Sentry secrets"

      - name: Upload to Play closed track
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play.json
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}
        run: |
          echo "$PLAY_JSON_KEY_BASE64" | base64 -d > "$PLAY_JSON_KEY_PATH"
          bundle exec fastlane android closed_track

      - name: Attach AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
