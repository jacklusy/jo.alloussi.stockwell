# Publish privacy policy to GitHub Pages (Play Console URL).

name: Privacy policy pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/privacy/**'
      - 'docs/privacy-policy.md'
      - '.github/workflows/pages-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/privacy/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
